# Wolf Terminal — Default Settings
# Installed to ~/.warp-oss/settings.toml by script/install-wfk.sh
#
# TOML paths verified against Warp OSS source (v0.2026.04.29.08.56.stable_00)

# --- Theme ---
# Path must be the full absolute path — Warp stores full paths in its theme map key.
# install-wfk.sh writes this file with the actual home directory substituted in.
[appearance.themes.theme]
custom = { name = "Wolf", path = "WOLF_THEME_PATH_PLACEHOLDER" }

# --- Font ---
# SuperSansMono is bundled in fonts/ and installed by install-wfk.sh.
# Warp falls back to system monospace if the font isn't found.
[appearance.text]
font_name = "Super Sans Mono"
font_size = 13.0

# --- Notifications ---
# Send a macOS system notification when a long-running command finishes.
# Also notifies when a session needs attention (e.g. password prompt).
[notifications.preferences]
mode = "enabled"
is_long_running_enabled = true
long_running_threshold = 10
is_password_prompt_enabled = true
is_agent_task_completed_enabled = true
is_needs_attention_enabled = true
play_notification_sound = true

# --- CLI Agent (Claude Code) ---
# Show the rich input toolbar when a CLI agent (e.g. claude) is running.
# Auto-toggle closes rich input when Claude Code needs direct keyboard interaction.
[agents.third_party]
should_render_cli_agent_toolbar = true
auto_toggle_composer = true
