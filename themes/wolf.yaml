# Wolf Terminal Theme
# Brand: Superhuman — Mysteria Gradient, full saturation

# --- Background ---
# Vivid Mysteria purple → deep purple-black
background:
  top: "#7B2D8B"
  bottom: "#1A0B20"

# --- Foreground ---
# Cloud 100 — warm off-white
foreground: "#FCFAF7"

# --- Accent ---
# Cloud Soft → Wisteria
accent:
  left: "#857DFA"
  right: "#D6D3FE"

# --- Details level ---
details: "lighter"

# --- Terminal Color Palette ---
terminal_colors:
  normal:
    black:   "#1A0B20"
    red:     "#FF6B81"
    green:   "#44C2A0"
    yellow:  "#FF7723"
    blue:    "#857DFA"
    magenta: "#8445E2"
    cyan:    "#B2CFFE"
    white:   "#FCFAF7"
  bright:
    black:   "#5C2D66"
    red:     "#FFBDBE"
    green:   "#7dd9c2"
    yellow:  "#FFD4A0"
    blue:    "#D6D3FE"
    magenta: "#ED6EFA"
    cyan:    "#D4E9FF"
    white:   "#FFFFFF"
