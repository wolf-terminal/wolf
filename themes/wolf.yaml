# Wolf Terminal Theme
# Brand: Superhuman — Mysteria Gradient, full saturation

# --- Background ---
# Vivid Mysteria purple → deep purple-black
background:
  top: "#7B2D8B"
  bottom: "#1A0B20"

# --- Foreground ---
# Pale lavender — readable on dark bg, clearly in the purple family
foreground: "#E8DFFF"

# --- Accent ---
# Wisteria → Cloud Soft
accent:
  left: "#857DFA"
  right: "#D6D3FE"

# --- Details level ---
details: "lighter"

# --- Terminal Color Palette ---
terminal_colors:
  normal:
    black:   "#1A0B20"
    red:     "#FF6B81"
    green:   "#44C2A0"
    yellow:  "#FFA040"
    blue:    "#857DFA"
    magenta: "#C97EF0"
    cyan:    "#C4BAFF"
    white:   "#E8DFFF"
  bright:
    black:   "#5C2D66"
    red:     "#FFBDBE"
    green:   "#7DD9C2"
    yellow:  "#FFD4A0"
    blue:    "#D6D3FE"
    magenta: "#ED6EFA"
    cyan:    "#DDD8FF"
    white:   "#FFFFFF"
